services:
  postgres:
    image: postgres:16-alpine
    container_name: dms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dms-backend
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dms-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"

  simulator:
    build:
      context: ./simulator
      dockerfile: Dockerfile
    container_name: dms-simulator
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      DMS_API_URL: http://backend:8080/api/v1
      DMS_USERNAME: admin
      DMS_PASSWORD: admin123

volumes:
  postgres_data: